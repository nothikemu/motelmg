name: Test and build installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: ruff check motelmg tests packaging
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - run: pip install -r requirements-dev.txt
      - name: Build installer
        run: python packaging/build.py
      - name: Smoke test the packaged application
        run: python packaging/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: MotelMG-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
